<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Efou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060606;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.14);
    --ink: #F5F5F4;
    --ink-soft: #9C9C9A;
    --accent: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .glow {
    position: absolute;
    top: -260px;
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    height: 620px;
    pointer-events: none;
    opacity: 0.9;
  }

  .glow .petal {
    position: absolute;
    inset: 0;
    border-radius: 0% 46% 46% 46%;
    transform: rotate(-35deg);
    overflow: hidden;
    background:
      repeating-linear-gradient(
        58deg,
        rgba(255,255,255,0.5) 0px,
        rgba(255,255,255,0.5) 1px,
        transparent 1px,
        transparent 5px
      );
    -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
    animation: morph 9s ease-in-out infinite;
  }

  @keyframes morph {
    0%   { border-radius: 0% 46% 46% 46%; transform: rotate(-35deg) scale(1); }
    25%  { border-radius: 12% 42% 50% 36%; transform: rotate(-27deg) scale(1.04); }
    50%  { border-radius: 3% 50% 40% 48%; transform: rotate(-41deg) scale(0.97); }
    75%  { border-radius: 16% 36% 48% 42%; transform: rotate(-31deg) scale(1.02); }
    100% { border-radius: 0% 46% 46% 46%; transform: rotate(-35deg) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow .petal { animation: none; }
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 1.5rem;
  }

  .code {
    font-size: 4.5rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
    line-height: 1;
  }

  .message {
    color: var(--ink-soft);
    font-size: 1rem;
    margin: 0.9rem 0 1.8rem;
  }

  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.65rem 1.3rem;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .home-btn:hover,
  .home-btn:focus-visible {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
  <div class="glow">
    <div class="petal"></div>
  </div>
  <div class="content">
    <p class="code">404</p>
    <p class="message">This page doesn't exist.</p>
    <a class="home-btn" href="index.html">← Back to home</a>
  </div>
</body>
</html>
